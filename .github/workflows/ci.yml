name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: migears
        ports:
          - 3306:3306
        # Make Actions wait until the server answers, so the integration suite
        # never races the container's initialisation.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmigears"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache Composer deps
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Unit tests (SQLite in memory)
        run: composer test:unit -- --fail-on-skipped

      - name: Integration tests (real MySQL via service container)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: migears
          MYSQL_DB: migears_mitable_test
        # A skipped integration test exits 0, so without this flag an
        # unreachable database would turn the build green while testing
        # nothing. Skipping stays the sane default locally.
        run: composer test:integration -- --fail-on-skipped
